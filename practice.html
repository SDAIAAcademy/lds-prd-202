<section>
<h2>اليوم 1: من آثار التنفيذ إلى تصنيف للفشل</h2>
<ol>
<li><p>يعرض مورد لمساعد جدولة المدربين «نسبة نجاح 90% على 40 مهمة». تريد مقارنته بمساعد آخر يقيس الاعتمادية لا القدرة. ما المعلومة التي تحتاجها أولًا؟</p><ul><li><b>أ.</b> عدد مهام أكبر من أربعين في المحاولة الواحدة نفسها</li><li><b>ب.</b> عدد المهام التي نجحت في كل المحاولات المتكررة</li><li><b>ج.</b> زمن الاستجابة المتوسط للمهام الأربعين</li><li><b>د.</b> تقييم المدربين للتجربة بعد استخدامها</li></ul></li>
<li><p>في أثر من مساعد جدولة المدربين يسأل مدرب عن رصيد إجازته، فيسترجع المساعد سياسة الإجازات لسنة سابقة، ويرد برصيد أقل من الصحيح بيومين. أي ملاحظة تكتب؟</p><ul><li><b>أ.</b> هلوسة من النموذج في رد الإجازات على المدرب</li><li><b>ب.</b> النموذج صغير ولا يحسب الأرصدة</li><li><b>ج.</b> المدرب سيغضب حين يرى الرصيد ويرفع شكوى إلى مدير النادي</li><li><b>د.</b> استرجع سياسة سنة سابقة، فجاء الرصيد أقل بيومين</li></ul></li>
<li><p>بعد أن اتفقت مع المهندس على خمسة أنماط لمساعد الجدولة، تقرأ أثرًا يطلب فيه مدرب إجازة مرضية، فيرد المساعد بنصيحة طبية ولا يحوّل الطلب إلى الموارد البشرية. لا تنطبق عليه قاعدة دخول أي نمط من الخمسة. ماذا تفعل؟</p><ul><li><b>أ.</b> تعلّمه «جديد» وتكتب ملاحظته، وتعيد النظر في التشبع</li><li><b>ب.</b> تضعه في أقرب نمط حتى يبقى التصنيف خمسة أنماط</li><li><b>ج.</b> تستبعده من العدّ، فهو أثر واحد فقط</li><li><b>د.</b> تسأل المهندس أي نمط يناسبه أكثر من غيره، وتأخذ برأيه دون نقاش</li></ul></li>
<li><p>في 200 أثر من مساعد الجدولة: «لغة لا تطابق» 30 مرة شدتها 2، و«نادٍ غير المطلوب» 18 مرة شدتها 3، و«حذف نوبة دون إشعار المدرب» 4 مرات شدتها 4، و«رفض سؤال يجيب عنه» 22 مرة شدتها 2. ما الأول؟</p><ul><li><b>أ.</b> لغة لا تطابق، 30 مرة</li><li><b>ب.</b> نادٍ غير المطلوب، أعلى حاصل ضرب</li><li><b>ج.</b> حذف نوبة دون إشعار المدرب</li><li><b>د.</b> رفض سؤال يجيب عنه، 22 مرة</li></ul></li>
<li><p>يعرض مورد لمساعد جدولة المدربين أن «نسبة الهلوسة أقل من 2%، قيست بنموذجنا المصحح على 5,000 رد». ما المعلومة التي تحتاجها قبل أن تصدّق الرقم؟</p><ul><li><b>أ.</b> عدد ردود أكبر بكثير من 5,000 يصححها النموذج المصحح نفسه في التقرير القادم</li><li><b>ب.</b> زمن استجابة المصحح لكل رد</li><li><b>ج.</b> نسبة اتفاق المصحح مع حكم بشري على عينة من الردود</li><li><b>د.</b> نسبة الهلوسة نفسها في التقرير السابق لمعرفة اتجاهها</li></ul></li>
<li><p>إذا نجح مساعد في 90% من المهام في تشغيل واحد، فنحو 90% من المهام ستنجح في كل تشغيل.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>معيار قبول لمساعد الجدولة يقول: «الرد مفيد للمدرب، من 1 إلى 5». أي صياغة تجعله معيارًا ثنائيًا يتفق عليه المصححون؟</p><ul><li><b>أ.</b> الرد يذكر الخطوة التالية التي يتخذها المدرب</li><li><b>ب.</b> يقيّم مصححان الفائدة من 1 إلى 10 ويؤخذ المتوسط</li><li><b>ج.</b> طول الرد أكثر من 50 كلمة</li><li><b>د.</b> يضغط المدرب زر الإعجاب بعد الرد</li></ul></li>
<li><p>ادعاء دقة يُعرض متوسطًا واحدًا لكل المستخدمين قد يخفي فشلًا يتركز في لغة واحدة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في أثر من مساعد الجدولة أعادت أداة الإجازات «error: balance_service_down»، وقال الرد للمدرب: «تمت الموافقة على إجازتك». أي ملاحظة مفتوحة تكتب؟</p><ul><li><b>أ.</b> مشكلة في خدمة الإجازات</li><li><b>ب.</b> الأداة أعادت خطأً، والرد يقول إن الإجازة اعتُمدت</li><li><b>ج.</b> النموذج لا يفهم طلبات الإجازة</li><li><b>د.</b> المدرب سيتغيب يوم الإجازة دون أن تكون إجازته معتمدة في النظام</li></ul></li>
<li><p>في 150 أثرًا من مساعد الجدولة: نمط «أ» 12 مرة شدته 3، ونمط «ب» 25 مرة شدته 2، ونمط «ج» مرتان شدته 4، ونمط «د» 18 مرة شدته 2. بقاعدة المقرر، ما النمط الثاني في الترتيب؟</p><ul><li><b>أ.</b> نمط «أ»، أعلى شدة بين «أ» و«ب» و«د»</li><li><b>ب.</b> نمط «د»، بحاصل ضرب يساوي حاصل «أ»</li><li><b>ج.</b> نمط «ج»، شدته 4</li><li><b>د.</b> نمط «ب»، أعلى حاصل ضرب بعد «ج»</li></ul></li>
<li><p>يُسمّى نمط الفشل بسببه الهندسي، حتى يعرف المهندسون ما يصلحون.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>وسمت 60 أثرًا لمساعد الجدولة من ناديين في الرياض، ولم يظهر نمط جديد في آخر 20 أثرًا. ما الذي تستنتجه؟</p><ul><li><b>أ.</b> التصنيف كامل ولا حاجة لوسم آثار أخرى</li><li><b>ب.</b> التصنيف بلغ التشبع لهذه العينة، وأندية أخرى قد تضيف أنماطًا</li><li><b>ج.</b> العينة صغيرة فلا قيمة للتصنيف</li><li><b>د.</b> يجب وسم كل آثار الشهر في الأندية كلها قبل أي استنتاج عن التصنيف</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: مجموعة التقييم وخطة التجربة</h2>
<ol>
<li><p>فريق التسويق يصنّف آثار مساعد نصوص العروض. اقترح أعضاء الفريق أربعة أسماء لنمط واحد. أيها يتبع قاعدة المقرر في التسمية؟</p><ul><li><b>أ.</b> مشكلة في فهرس العروض القديمة</li><li><b>ب.</b> النموذج الصغير لا يفهم التواريخ</li><li><b>ج.</b> النص يذكر خصمًا انتهى موعده</li><li><b>د.</b> أخطاء متنوعة في العرض</li></ul></li>
<li><p>معيار في مساعد جدولة المدربين: «لا يذكر الرد ناديًا غير المذكور في طلب المدرب». أسماء الأندية الستة ثابتة، وكل طلب فيه اسم نادٍ واحد. ما المصحح الأنسب أولًا؟</p><ul><li><b>أ.</b> قاعدة تقارن أسماء الأندية في الرد باسم النادي في الطلب</li><li><b>ب.</b> مصحح نموذجي يقرأ الطلب والرد كاملين ويحكم على اسم النادي</li><li><b>ج.</b> مراجعة بشرية من فريق التدريب لكل الردود</li><li><b>د.</b> مصحح نموذجي، ثم مراجعة بشرية لكل ما يرفضه</li></ul></li>
<li><p>أربعة مصححات نموذجية لمعايير في مساعد نصوص العروض، كل منها عُوير على 60 حكمًا بشريًا. أيها يُعتمد؟</p><ul><li><b>أ.</b> اتفاق 94%، والتقاط 70%، وقبول 99%، وأضعف لغة 3 من 5</li><li><b>ب.</b> اتفاق 92%، والتقاط 88%، وقبول 93%، وأضعف لغة 1 من 4</li><li><b>ج.</b> اتفاق 86%، والتقاط 90%، وقبول 85%، وأضعف لغة 4 من 6</li><li><b>د.</b> اتفاق 90%، والتقاط 87%، وقبول 91%، وأضعف لغة 3 من 5</li></ul></li>
<li><p>بعد تنظيف مجموعة مساعد العروض بقي 75 مثالًا، والقواعد تطلب 10 أمثلة لنمط «خصم منتهٍ»، والموجود 7. موعد التقييم غدًا. ما الصحيح؟</p><ul><li><b>أ.</b> يكرر ثلاثة أمثلة من النمط حتى يبلغ العدد 10</li><li><b>ب.</b> يصدر v1.0 ويكتب النقص فجوة معروفة، ويضيف الأمثلة في v1.1</li><li><b>ج.</b> يصدر v1.0 دون ذكر النقص، فالمجموعة كبيرة بما يكفي</li><li><b>د.</b> يعيد إلى المجموعة ثلاثة أمثلة من النمط حُذفت للتسرب من التعليمات</li></ul></li>
<li><p>خطة اختبار رسالة التذكير تقول: 14 يومًا، ونظرة واحدة في نهايتها. في اليوم الثالث تُظهر اللوحة أن الرسالة الجديدة ترفع الحضور 5 نقاط بفرق «دال». يطلب التسويق إيقاف الاختبار واعتماد الرسالة. ما الرد الذي تدعمه الخطة؟</p><ul><li><b>أ.</b> نوقف الآن: الفرق أكبر من أقل أثر يهم</li><li><b>ب.</b> نكمل، ونجعل الإلغاء المقياس الأساسي</li><li><b>ج.</b> نكمل إلى اليوم 14، ونوقف قبله لضرر فقط</li><li><b>د.</b> نكمل إلى نهاية الأسبوع الأول، ثم نقرر</li></ul></li>
<li><p>أي معيار من معايير مساعد الجدولة يصلح له فحص برمجي دون مصحح نموذجي؟</p><ul><li><b>أ.</b> الرد ودود ومهذب</li><li><b>ب.</b> الرد يشرح سياسة التبديل بوضوح</li><li><b>ج.</b> عدد أيام الإجازة في الرد يساوي الرصيد في نظام الموارد البشرية</li><li><b>د.</b> الرد لا يضيف أي معلومة أو وعد لا تذكره المصادر التي استرجعها المساعد</li></ul></li>
<li><p>مصحح نموذجي لمعيار «الرد يذكر نادي المدرب» قيس على 54 حكمًا بشريًا: الاتفاق 91%، ويقبل 97% من حالات النجاح، ويلتقط 12 من 16 حالة فشل (75%)، وفي اللهجة الخليجية 2 من 6. بقاعدة المقرر (التقاط 85% فأكثر، وقبول 90% فأكثر، ولا لغة تحت النصف)، ماذا تقرر؟</p><ul><li><b>أ.</b> يُعتمد، فالاتفاق 91%</li><li><b>ب.</b> يُعتمد بعد إضافة 20 حكمًا بشريًا آخر</li><li><b>ج.</b> يُستبعد كل مصحح نموذجي لهذا المعيار نهائيًا</li><li><b>د.</b> لا يقرر وحده: مراجعة بشرية، أو فرز أولي تراجعه البشرية</li></ul></li>
<li><p>مثال تقييم نصه موجود في أمثلة تعليمات المساعد يقيس ما حفظه المساعد أكثر مما يقيس قدرته.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>عدّل مهندس تعليمات مساعد الجدولة، ويريد إضافة عشرة أمثلة جديدة إلى مجموعة التقييم وإصدارها v2.1 في اليوم نفسه. من يعتمد الإصدار؟</p><ul><li><b>أ.</b> المهندس نفسه، وهو أعرف بالتعديل</li><li><b>ب.</b> مالك المنتج وحده، دون مراجعة</li><li><b>ج.</b> قائد فريق المراجعة البشرية، بعد أن يراجع الأمثلة</li><li><b>د.</b> يُعتمد الإصدار آليًا متى نجح المساعد في كل الأمثلة الجديدة العشرة</li></ul></li>
<li><p>تختبر إدارة التسويق رسالة تذكير بالحصص. نسبة الحضور الحالية 40%، وأقل أثر يهم 3 نقاط مئوية، والاختبار ثنائي الطرف عند 5% بقوة 80%. كم عضوًا تحتاج كل ذراع تقريبًا؟</p><ul><li><b>أ.</b> 127</li><li><b>ب.</b> 4,231</li><li><b>ج.</b> 9,490</li><li><b>د.</b> 42,310</li></ul></li>
<li><p>خطة اختبار رسالة التذكير تقول: 14 يومًا، ونظرة واحدة في النهاية. في اليوم الثاني تعرض اللوحة فرقًا 6 نقاط «دالًا إحصائيًا»، ويطلب المدير الإيقاف والإطلاق. ما الرد الذي تدعمه الخطة؟</p><ul><li><b>أ.</b> نوقف الآن، فالفرق دال إحصائيًا</li><li><b>ب.</b> نوقف إن بقي الفرق دالًا إحصائيًا في نظرة اليوم الثالث أيضًا</li><li><b>ج.</b> نكمل إلى اليوم الرابع عشر، ونقرر بالنظرة المخطط لها</li><li><b>د.</b> نوقف ونعيد التجربة بعينة أصغر</li></ul></li>
<li><p>التشغيل الظلي (shadow deployment) يقيس كيف يستجيب الأعضاء لردود المساعد الجديد.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: قراءة التجربة واقتصادياتها وقرار الإطلاق</h2>
<ol>
<li><p>مصحح نموذجي لمعيار «لا يذكر النص خصمًا منتهيًا» في مساعد نصوص العروض، شدته 3. المعايرة على 60 حكمًا بشريًا: التقاط الفشل 82%، وقبول النجاح 97%، وأضعف لغة يلتقط فيها 2 من 5. ما الذي تقوله قاعدة المقرر؟</p><ul><li><b>أ.</b> يُعتمد، فقبوله للنجاح فوق 90% بفارق واضح عن الحد في القاعدة</li><li><b>ب.</b> يُعتمد بعد خفض حد الالتقاط في القاعدة إلى 80%</li><li><b>ج.</b> يُعتمد في اللغات الأخرى، ويُترك أضعفها بلا تصحيح</li><li><b>د.</b> لا يقرر وحده: مراجعة بشرية، أو فرز أولي تراجعه البشرية</li></ul></li>
<li><p>خطة اختبار رسالة التذكير: تُطلق الرسالة إذا كان الحد الأدنى لفترة فرق الحضور فوق الصفر، ولم يسؤ إلغاء الاشتراك بفترة كلها فوق الصفر في أي لغة. النتائج في الشريحتين السابقتين. ما القرار؟</p><ul><li><b>أ.</b> إطلاق الرسالة لكل الأعضاء، فالحضور يرتفع بفترة فوق الصفر</li><li><b>ب.</b> مواصلة التحسين: إصلاح الرسالة الإنجليزية ثم اختبار جديد</li><li><b>ج.</b> إيقاف الرسالة الجديدة نهائيًا في اللغتين، فلا إصلاح لها</li><li><b>د.</b> تمديد الاختبار أسبوعين حتى تضيق الفترة في العربية</li></ul></li>
<li><p>مساعد لكتابة ردود على تقييمات النوادي في الخرائط. النموذج س: 0.03 ريال لكل رد، ويُقبل 90% من ردوده. النموذج ص: 0.003 ريال، ويُقبل 50%. إعادة كتابة الرد المرفوض 5 ريالات. أيهما أرخص لكل رد مقبول، مع إعادة الكتابة؟</p><ul><li><b>أ.</b> س: نحو 0.59 ريال، مقابل نحو 5 ريالات لـص</li><li><b>ب.</b> ص: سعره عُشر سعر س لكل رد</li><li><b>ج.</b> ص: 0.006 ريال لكل رد مقبول</li><li><b>د.</b> متساويان بعد إضافة إعادة الكتابة</li></ul></li>
<li><p>في مساعد ردود التقييمات: تكلفة النماذج 0.03 ريال للرد، والقبول 90%، وإعادة كتابة المرفوض 5 ريالات. أي تغيير يحرك التكلفة لكل رد مقبول أكثر من غيره؟</p><ul><li><b>أ.</b> مضاعفة أسعار المزود في العقد الجديد</li><li><b>ب.</b> مضاعفة عدد الردود في الشهر</li><li><b>ج.</b> خفض الأسعار 30% بعقد سنوي</li><li><b>د.</b> انخفاض القبول من 90% إلى 85%</li></ul></li>
<li><p>معايير إطلاق لمساعد ردود التقييمات. في كل صف: من يعدّ الدليل، ومن يعتمده. أي صف يحتاج تصحيحًا؟</p><ul><li><b>أ.</b> التكلفة: يعدّها مالك المنتج، ويعتمدها مدير المالية</li><li><b>ب.</b> الجودة: يعدّ نتائجها كاتب التعليمات، ويعتمدها هو</li><li><b>ج.</b> الخصوصية: ينفذها الفريق الهندسي، وتعتمدها مسؤولة البيانات</li><li><b>د.</b> التجربة: يعدّ تقريرها مالك المنتج، وتعتمدها المالكة التجارية</li></ul></li>
<li><p>نتيجة اختبار رسالة التذكير (6,000 عضو في كل ذراع): الحضور ارتفع 2.3 نقطة (فترة 95%: 0.5 إلى 4.1). مقياس الحماية، إلغاء الاشتراك في الرسائل، ارتفع 1.05 نقطة (0.6 إلى 1.5)، ومعظمه في الرسائل الإنجليزية: 2.7 نقطة (1.7 إلى 3.6) مقابل 0.3 في العربية (-0.1 إلى 0.8). الخطة: لا إطلاق إن ارتفع مقياس الحماية ارتفاعًا واضحًا. ما القرار الذي تدعمه النتيجة؟</p><ul><li><b>أ.</b> إطلاق الرسالة للجميع، فالحضور، وهو المقياس الأساسي، ارتفع بوضوح</li><li><b>ب.</b> لا إطلاق كما هي: مقياس الحماية ارتفع، وأكثره في الإنجليزية</li><li><b>ج.</b> إعادة الاختبار كاملًا، فالفترات واسعة</li><li><b>د.</b> إطلاق الرسالة الإنجليزية وحدها</li></ul></li>
<li><p>مساعد نصوص العروض في التسويق: النموذج الكبير 0.0396 ريال للاستدعاء ويُقبل 88% من مسوداته، والصغير 0.0026 ريال ويُقبل 60%. إعادة كتابة مسودة مرفوضة تكلف كاتبًا 4 ريالات. التكلفة لكل مسودة مقبولة مع إعادة الكتابة: الكبير 0.60 ريال، والصغير 2.67 ريال. ما الأرخص؟</p><ul><li><b>أ.</b> الصغير، فاستدعاؤه أرخص 15 مرة</li><li><b>ب.</b> متساويان، فالفرق في الاستدعاء يعوض الفرق في القبول</li><li><b>ج.</b> الصغير، إن احتُسبت تكلفة النموذج وحدها لكل مسودة</li><li><b>د.</b> الكبير، لكل مسودة مقبولة</li></ul></li>
<li><p>كتب مدرب سؤالًا من 9 كلمات لمساعد الجدولة، وفوترت البوابة 3,584 وحدة إدخال. من أين جاء أغلب الفرق؟</p><ul><li><b>أ.</b> من التعليمات ومقتطف الجدول وسجل المحادثة المرسلة مع كل سؤال</li><li><b>ب.</b> من ترجمة السؤال إلى الإنجليزية داخل النموذج قبل أن يجيب عنه بالعربية</li><li><b>ج.</b> من رد المساعد، فهو يُحسب ضمن الإدخال</li><li><b>د.</b> من خطأ في عدّاد البوابة</li></ul></li>
<li><p>قد يتجاوز المئين 95 لزمن المهمة مستوى الخدمة حتى لو كان متوسط الزمن أقل منه بكثير.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>فعّل فريق مساعد الجدولة التخزين المؤقت للتعليمات (prompt caching). أي جزء من التكلفة ينخفض؟</p><ul><li><b>أ.</b> وحدات الإخراج، فالرد يصبح أقصر</li><li><b>ب.</b> الإدخال الثابت المتكرر، فيُحسب بسعر الإدخال المخزن</li><li><b>ج.</b> عدد الاستدعاءات لكل مهمة</li><li><b>د.</b> تكلفة المهام الفاشلة التي يتولاها موظف خدمة الأعضاء بعد المساعد</li></ul></li>
<li><p>معيار إطلاق لمساعد الجدولة: «لا فشل في معيار التبديل دون موافقة، في ثلاث محاولات». من يشغّل التقييم ومن يعتمد نتيجته؟</p><ul><li><b>أ.</b> المهندس يشغّله ويعتمده، فهو أعرف بالنظام</li><li><b>ب.</b> مالك المنتج يشغّله ويعتمده، فهو صاحب القرار</li><li><b>ج.</b> المهندس يشغّله، وقائد المراجعة البشرية يعتمد النتيجة</li><li><b>د.</b> المورد يشغّل التقييم في بيئته ويرسل شهادة موقعة بالنتيجة</li></ul></li>
<li><p>أي سطر يصلح إشارة في مواصفة مراقبة لمساعد الجدولة بعد إطلاقه؟</p><ul><li><b>أ.</b> نسبة التبديلات المؤكدة التي رفضها النظام، أسبوعيًا ولكل لغة؛ إنذار فوق 0.5%؛ يوقف التأكيد الآلي؛ المالك قائد المراجعة</li><li><b>ب.</b> مراقبة جودة المساعد باستمرار والتدخل عند الحاجة</li><li><b>ج.</b> عدد المحادثات اليومية، دون عتبة</li><li><b>د.</b> رضا المدربين في استبيان سنوي</li></ul></li>
<li><p>إذا عبرت تهيئة كل عتبات الجودة لكنها تجاوزت مستوى الخدمة في زمن الاستجابة، فقرار الإطلاق يحتاج شرطًا أو تغييرًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>مساعد نصوص العروض يعبر عتبات الجودة ومستوى الخدمة، وتكلفته ضمن الموازنة عند الحجم الحالي، لكنها تتجاوزها إذا امتد إلى كل الإدارات. ما القرار الأنسب؟</p><ul><li><b>أ.</b> إيقاف المشروع، فهو يتجاوز الموازنة في أحد السيناريوهات</li><li><b>ب.</b> إطلاق للحجم الحالي، مع بوابة تكلفة تُراجع قبل أي توسع</li><li><b>ج.</b> إطلاق لكل الإدارات، والموازنة تُعدّل لاحقًا</li><li><b>د.</b> تأجيل القرار حتى تنخفض الأسعار</li></ul></li>
</ol>
